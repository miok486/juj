<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#ff4d5e"/>
      <stop offset="40%" stop-color="#d7142b"/>
      <stop offset="80%" stop-color="#7a0414"/>
      <stop offset="100%" stop-color="#3d0008"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a95" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b30d24" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="wave2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb3ba" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5c0010" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ffc2c8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff5a6a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 흐르는 물결 -->
  <path d="M0,720 C320,600 640,860 960,740 C1280,620 1600,820 1920,700 L1920,1080 L0,1080 Z" fill="url(#wave1)"/>
  <path d="M0,820 C360,760 620,960 1000,860 C1360,760 1640,960 1920,880 L1920,1080 L0,1080 Z" fill="url(#wave2)"/>
  <path d="M0,560 C400,440 760,700 1120,580 C1440,470 1700,600 1920,520" fill="none" stroke="#ffd6da" stroke-opacity="0.35" stroke-width="3" filter="url(#soft)"/>

  <!-- 보케 빛망울 -->
  <g filter="url(#blur)">
    <circle cx="420" cy="260" r="140" fill="url(#orb)" opacity="0.7"/>
    <circle cx="1500" cy="220" r="200" fill="url(#orb)" opacity="0.45"/>
    <circle cx="1220" cy="520" r="90" fill="url(#orb)" opacity="0.6"/>
    <circle cx="260" cy="700" r="110" fill="url(#orb)" opacity="0.4"/>
    <circle cx="1720" cy="760" r="130" fill="url(#orb)" opacity="0.5"/>
  </g>
  <g>
    <circle cx="760" cy="180" r="10" fill="#fff" opacity="0.7" filter="url(#soft)"/>
    <circle cx="980" cy="380" r="6" fill="#fff" opacity="0.8"/>
    <circle cx="1340" cy="330" r="14" fill="#ffd1d6" opacity="0.6" filter="url(#soft)"/>
    <circle cx="560" cy="480" r="7" fill="#fff" opacity="0.6"/>
    <circle cx="1640" cy="460" r="5" fill="#fff" opacity="0.8"/>
    <circle cx="180" cy="380" r="9" fill="#ffe0e3" opacity="0.6" filter="url(#soft)"/>
  </g>

  <!-- 가운데 하트 -->
  <g transform="translate(960 470)">
    <path d="M0,90 C-40,50 -150,0 -150,-80 C-150,-140 -100,-170 -60,-170 C-30,-170 -10,-150 0,-130 C10,-150 30,-170 60,-170 C100,-170 150,-140 150,-80 C150,0 40,50 0,90 Z"
          fill="#ffffff" opacity="0.18" filter="url(#blur)"/>
    <path d="M0,90 C-40,50 -150,0 -150,-80 C-150,-140 -100,-170 -60,-170 C-30,-170 -10,-150 0,-130 C10,-150 30,-170 60,-170 C100,-170 150,-140 150,-80 C150,0 40,50 0,90 Z"
          fill="none" stroke="#ffe5e8" stroke-width="4" stroke-opacity="0.85"/>
  </g>
</svg>
